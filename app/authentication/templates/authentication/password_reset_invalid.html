{% extends "base.html" %}

{% block title %}Link indisponível — Vaulta{% endblock %}

{% block content %}
<section class="result-page">
    <div class="result-card">
        <span class="result-icon result-error" aria-hidden="true">!</span>
        <span class="eyebrow">Não foi possível continuar</span>
        <h1>Link indisponível</h1>
        <p>Este link não é válido ou já expirou. Solicite novas instruções para continuar.</p>
        <a class="button" href="{% url 'authentication:password-recovery' %}">Solicitar novo link</a>
    </div>
</section>
{% endblock %}
